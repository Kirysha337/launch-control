<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#000"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#000" stroke-width="1.3"/></marker>
  <marker id="tri" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#000" stroke-width="1.1"/></marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8"><circle cx="5" cy="5" r="4.2" fill="#000"/></marker>
  <marker id="diamond" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="12" markerHeight="9" orient="auto-start-reverse"><path d="M1,5 L7,1 L13,5 L7,9 z" fill="#fff" stroke="#000" stroke-width="1.1"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<rect x="450" y="290" width="600" height="220" rx="0" fill="#FFFFF0" stroke="#000" stroke-width="1.5"/>
<text x="750.0" y="392.1" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#000">Автоматизировать управление</text>
<text x="750.0" y="409.6" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#000">центром космических пусков</text>
<text x="1042" y="502.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" font-weight="bold" fill="#000">A0</text>
<polyline points="15,320 450,320" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="20" y="314.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">Заявки на пуск: тип носителя, полезная нагрузка, орбита, окно</text>
<polyline points="15,358 450,358" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="20" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">Сведения о поступающих партиях топлива</text>
<polyline points="15,396 450,396" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="20" y="390.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">Метеоданные: ветер на высотах, температура, облачность, гроза</text>
<polyline points="15,434 450,434" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="20" y="428.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">Телеметрия каналов носителя (потери сигнала)</text>
<polyline points="15,472 450,472" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="20" y="466.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">Учётные данные сотрудников</text>
<text x="500" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">Права доступа ролей</text>
<text x="500" y="43.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">и регламент регистрации</text>
<polyline points="500,52 500,290" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="625" y="112.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">Регламент поэтапной</text>
<text x="625" y="127.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">подготовки к пуску</text>
<polyline points="625,136 625,290" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="750" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">Лимиты подготовок и нормативы</text>
<text x="750" y="43.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">моточасов и циклов площадок</text>
<polyline points="750,52 750,290" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="875" y="112.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">Предельные метеоусловия</text>
<text x="875" y="127.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">по типам носителей</text>
<polyline points="875,136 875,290" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1000" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">Сроки годности партий</text>
<text x="1000" y="43.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">топлива, формы отчётов</text>
<polyline points="1000,52 1000,290" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="1050,320 1490,320" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1060" y="314.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">Расписание пусков и журнал переносов с причинами</text>
<polyline points="1050,358 1490,358" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1060" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">Проведённые пуски с расходом топлива по партиям</text>
<polyline points="1050,396 1490,396" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1060" y="390.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">Журнал нештатных ситуаций телеметрии</text>
<polyline points="1050,434 1490,434" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1060" y="428.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">Графики межпускового обслуживания площадок</text>
<polyline points="1050,472 1490,472" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1060" y="466.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#000">Сводные отчёты руководителя</text>
<polyline points="620,680 620,510" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="620" y="700.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">Персонал центра: руководитель, инженер ТК,</text>
<text x="620" y="715.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">оператор телеметрии, метеоролог</text>
<polyline points="880,680 880,510" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="880" y="700.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">ПО «ЦУП Старт» (TypeScript, Express)</text>
<text x="880" y="715.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#000">и СУБД SQLite</text>
</svg>
